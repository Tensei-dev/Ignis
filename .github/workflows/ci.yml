name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # As bibliotecas da NVIDIA (grupo gpu) passam de 1 GB e não são usadas no CI.
  UV_NO_GROUP: gpu

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked --all-packages
      - run: uv run --locked --all-packages pre-commit run --all-files --show-diff-on-failure
      - run: uv run --locked --all-packages pre-commit run gitleaks-historico --hook-stage manual --all-files

  testes:
    strategy:
      fail-fast: false
      matrix:
        sistema: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.sistema }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked --all-packages
      - run: uv run --locked --all-packages pytest
      - run: uv export --locked --only-group dev -o dev-req.txt
      - run: uv run --isolated --locked --package ignis-cerebro --with-requirements dev-req.txt pytest cerebro
      - run: uv run --isolated --locked --package ignis-pc --with-requirements dev-req.txt pytest clientes/pc
