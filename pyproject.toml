[project]
name = "ignis"
version = "0.1.0"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
required-version = ">=0.13.9,<0.14"
# O grupo gpu traz as bibliotecas da NVIDIA (mais de 1 GB). Ele é instalado por
# padrão na máquina de desenvolvimento e desligado no CI com UV_NO_GROUP=gpu.
default-groups = ["dev", "gpu"]
# Sistemas em que todas as dependências precisam ter versão instalável: o PC de
# desenvolvimento e o Linux do CI. Sem isso, o uv pode escolher uma versão das
# bibliotecas da NVIDIA que só existe para Linux.
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.workspace]
members = ["cerebro", "mcp/*", "clientes/*"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
gpu = [
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.28.1.4",
]

[tool.pytest.ini_options]
testpaths = ["cerebro", "mcp", "clientes"]
addopts = ["--import-mode=importlib", "--strict-markers", "-ra"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "PLC2401", "PLC2403"]
# N818 pede o sufixo "Error" nas exceções, que não combina com nomes em
# português (D01), como ErroDeModelo.
ignore = ["N818"]

[tool.ruff.lint.isort]
known-first-party = ["ignis_*"]
